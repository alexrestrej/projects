          pool: Release-cloud
          name: '$(cloudformation-stack-name)-$(env)-kms'
          resource: kms
          jobname: kms

      - template: /Deployment/deployment.yaml@Cloud_cld0002001_arq_despliegues_cloud
        parameters:
          account: bancolombia-productos-financiacion-qa-aws
          pool: Release-cloud
          name: '$(cloudformation-stack-name)-$(env)-s3'
          resource: s3
          jobname: s3 

      - template: /Deployment/deployment.yaml@Cloud_cld0002001_arq_despliegues_cloud
        parameters:
          account: bancolombia-productos-financiacion-qa-aws
          pool: Release-cloud
          name: '$(cloudformation-stack-name)-$(env)-sg'
          resource: sg
          jobname: sg          

      - template: /Deployment/deployment.yaml@Cloud_cld0002001_arq_despliegues_cloud
        parameters:
          account: bancolombia-productos-financiacion-qa-aws
          pool: Release-cloud
          name: '$(cloudformation-stack-name)-$(env)-sm'
          resource: sm
          jobname: sm
          depends: 
          - kms     

      - template: /Deployment/deployment.yaml@Cloud_cld0002001_arq_despliegues_cloud
        parameters:
          account: bancolombia-productos-financiacion-qa-aws
          pool: Release-cloud
          name: '$(cloudformation-stack-name)-$(env)-reporting'
          resource: reporting
          jobname: reporting
          depends: 
          - sg                     

      - template: /Deployment/deployment.yaml@Cloud_cld0002001_arq_despliegues_cloud
        parameters:
          account: bancolombia-productos-financiacion-qa-aws
          pool: Release-cloud
          name: '$(cloudformation-stack-name)-$(env)-ec2'
          resource: ec2
          jobname: ec2       
          depends: 
          - sm  
          - sg 
          - kms
          - s3    


  - stage: code_scan_iac_pdn
    displayName: Code Scan IaC pdn
    variables:
      - group: aw0946001-serviciosfactoring-variables-pdn-aws
      
