          name: '$(cloudformation-stack-name)-$(env)-kms'
          resource: kms
          jobname: kms

      - template: /Deployment/deployment.yaml@Cloud_cld0002001_arq_despliegues_cloud
        parameters:
          account: bancolombia-productos-financiacion-pdn-aws
          pool: Release-cloud
          name: '$(cloudformation-stack-name)-$(env)-s3'
          resource: s3
          jobname: s3 

      - template: /Deployment/deployment.yaml@Cloud_cld0002001_arq_despliegues_cloud
        parameters:
