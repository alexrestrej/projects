      - template: /Deployment/deployment.yaml@Cloud_cld0002001_arq_despliegues_cloud
        parameters:
          account: bancolombia-productos-financiacion-pdn-aws
          pool: Release-cloud
          name: '$(cloudformation-stack-name)-$(env)-reporting'
          resource: reporting
          jobname: reporting
          depends: 
